{{ if .Values.mlflow.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: {{ .Values.mlflow.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: {{ .Values.mlflow.postgresql.image }}
        env:
        - name: POSTGRES_DB
          value: mlflow
        - name: POSTGRES_USER
          value: mlflow
        - name: POSTGRES_PASSWORD
          value: mlflow
        ports:
        - containerPort: 5432
        resources: {{ toYaml .Values.mlflow.postgresql.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ .Values.mlflow.namespace }}
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
{{ end }}
