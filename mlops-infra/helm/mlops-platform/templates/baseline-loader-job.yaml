{{ if .Values.baseline.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: model-loader
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: loader
        image: {{ .Values.baseline.loader.image }}
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mlflow-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mlflow-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: MLFLOW_S3_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: mlflow-secret
              key: MLFLOW_S3_ENDPOINT_URL
        - name: MODEL_BUCKET
          value: {{ .Values.baseline.loader.bucket }}
        - name: MODEL_PATH
          value: {{ .Values.baseline.loader.modelPath }}
        - name: PVC_NAME
          value: {{ .Values.baseline.pvc.name }}
        # предполагается, что образ содержит скрипт, который монтирует PVC и копирует модель
{{ end }}
