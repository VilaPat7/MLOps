{{ if .Values.protected.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cifar10-inference
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cifar10-inference
  template:
    metadata:
      labels:
        app: cifar10-inference
    spec:
      volumes:
        - name: shared-model
          emptyDir: {}
        - name: public-key
          secret:
            secretName: mlflow-secret
            items:
            - key: PUBLIC_KEY
              path: public_key.pem
      containers:
        - name: preprocessor
          image: {{ .Values.protected.images.preprocessor }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-server.mlflow-system.svc.cluster.local:5000"
            - name: MLFLOW_MODEL_NAME
              value: {{ .Values.protected.model.name | quote }}
            - name: MLFLOW_MODEL_STAGE
              value: {{ .Values.protected.model.stage | quote }}
            - name: PUBLIC_KEY_PATH
              value: "/app/keys/public_key.pem"
            - name: ANOMALY_DETECTOR_PATH
              value: "/app/anomaly_detector.pkl"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: MLFLOW_S3_ENDPOINT_URL
            - name: MLFLOW_S3_BUCKET
              value: "mlflow"
            - name: MLFLOW_MODEL_PREFIX
              value: {{ .Values.protected.model.prefix | quote }}
          volumeMounts:
            - name: shared-model
              mountPath: /shared/models
            - name: public-key
              mountPath: /app/keys
          resources: {{ toYaml .Values.protected.resources.preprocessor | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
        - name: tf-serving
          image: {{ .Values.protected.images.tfServing }}
          ports:
            - containerPort: 8500
              name: grpc
            - containerPort: 8501
          env:
            - name: MODEL_NAME
              value: {{ .Values.protected.model.name | quote }}
            - name: MODEL_BASE_PATH
              value: "/models"
          volumeMounts:
            - name: shared-model
              mountPath: /models
          resources: {{ toYaml .Values.protected.resources.tfServing | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 8500
            initialDelaySeconds: 5
            periodSeconds: 5
{{ end }}
