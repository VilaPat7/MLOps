{{ if .Values.mlflow.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.mlflow.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: {{ .Values.mlflow.minio.image }}
        args:
        - server
        - /data
        env:
        - name: MINIO_ACCESS_KEY
          value: {{ .Values.mlflow.minio.accessKey }}
        - name: MINIO_SECRET_KEY
          value: {{ .Values.mlflow.minio.secretKey }}
        ports:
        - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.mlflow.namespace }}
spec:
  selector:
    app: minio
  ports:
    - port: 9000
{{ end }}
