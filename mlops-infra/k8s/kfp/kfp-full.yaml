apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline-api-server
  namespace: kubeflow-pipelines
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-pipeline-api-server
  template:
    metadata:
      labels:
        app: ml-pipeline-api-server
    spec:
      serviceAccountName: kfp-service-account
      containers:
      - name: api-server
        # Используем доступный образ из Docker Hub
        image: gcr.io/ml-pipeline/api-server:1.8.3
        ports:
        - containerPort: 8888
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DEFAULT_ARTIFACT_ROOT
          value: "minio://mlpipeline/artifacts"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline-ui
  namespace: kubeflow-pipelines
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-pipeline-ui
  template:
    metadata:
      labels:
        app: ml-pipeline-ui
    spec:
      containers:
      - name: ui
        # Используем доступный образ из Docker Hub
        image: gcr.io/ml-pipeline/frontend:1.8.3
        ports:
        - containerPort: 3000
        env:
        - name: ML_PIPELINE_SERVICE_HOST
          value: ml-pipeline-api-server
        - name: ML_PIPELINE_SERVICE_PORT
          value: "8888"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
