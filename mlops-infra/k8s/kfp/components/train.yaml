name: Train CIFAR-10 (без DP)
description: Обучение CNN на CIFAR-10
inputs:
  - {name: data_path, type: String, default: ''}
  - {name: epochs, type: Integer, default: '5'}
  - {name: batch_size, type: Integer, default: '64'}
  - {name: learning_rate, type: Float, default: '0.001'}
outputs:
  - {name: model_uri, type: String}
  - {name: mlflow_run_id, type: String}
implementation:
  container:
    image: cifar10-train:latest
    env:
      MLFLOW_TRACKING_URI: http://mlflow-server.mlflow-system.svc.cluster.local:5000
    command: [
      python, /train.py,
      --data-path, {inputValue: data_path},
      --epochs, {inputValue: epochs},
      --batch-size, {inputValue: batch_size},
      --learning-rate, {inputValue: learning_rate}
    ]
