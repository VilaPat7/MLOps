name: Train CIFAR-10 (без DP)
description: Обучение CNN на CIFAR-10 без дифференциальной приватности
inputs:
  - {name: data_path, type: String, description: 'Path to training data (optional)'}
  - {name: epochs, type: Integer, default: '5'}
  - {name: batch_size, type: Integer, default: '64'}
  - {name: learning_rate, type: Float, default: '0.001'}
outputs:
  - {name: model_uri, type: String, description: 'MLflow model URI'}
  - {name: mlflow_run_id, type: String}
implementation:
  container:
    image: your-registry.example.com/mlops/train:latest
    env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow-server.mlflow-system.svc.cluster.local:5000
    command: [
      python, /train.py,
      --data-path, {inputValue: data_path},
      --epochs, {inputValue: epochs},
      --batch-size, {inputValue: batch_size},
      --learning-rate, {inputValue: learning_rate}
    ]
