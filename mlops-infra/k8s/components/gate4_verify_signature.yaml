name: Signature Verification
description: Проверка цифровой подписи модели
inputs:
  - {name: model_path, type: String, description: 'Path to model file'}
  - {name: signature_file, type: String, description: 'JSON file with signature'}
  - {name: public_key, type: String, description: 'Path to public key PEM file'}
outputs:
  - {name: report, type: String, description: 'Verification report JSON'}
implementation:
  container:
    image: your-registry.example.com/mlops/gate4_signature_verify:latest
    command: [
      python, /app/verify_signature.py,
      --public-key, {inputValue: public_key},
      --signature-file, {inputValue: signature_file},
      --model-path, {inputValue: model_path},
      --output-report, {outputPath: report}
    ]
