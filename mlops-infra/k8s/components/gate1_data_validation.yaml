name: Data Validation
description: Проверка целостности данных (data poisoning detection)
inputs:
  - {name: data_path, type: String, description: 'Path to input data (CSV)'}
  - {name: threshold_sigma, type: Float, default: '3.0', description: 'Z-score threshold'}
  - {name: label_col, type: String, default: 'label', description: 'Column name for labels'}
outputs:
  - {name: report, type: String, description: 'Validation report JSON'}
implementation:
  container:
    image: your-registry.example.com/mlops/gate1_data_validation:latest
    command: [
      python, /app/validate_data.py,
      --data-path, {inputValue: data_path},
      --threshold-sigma, {inputValue: threshold_sigma},
      --label-col, {inputValue: label_col},
      --output-report, {outputPath: report}
    ]
