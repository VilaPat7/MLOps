name: Model Validation
description: Проверка качества и целостности модели
inputs:
  - {name: model_uri, type: String, description: 'MLflow model URI'}
  - {name: test_data, type: String, description: 'Path to test data (.npz)'}
  - {name: accuracy_threshold, type: Float, default: '0.7', description: 'Minimum required accuracy'}
outputs:
  - {name: report, type: String, description: 'Validation report JSON'}
implementation:
  container:
    image: your-registry.example.com/mlops/gate3_model_validation:latest
    env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow-server.mlflow-system.svc.cluster.local:5000
    command: [
      python, /app/validate_model.py,
      --model-uri, {inputValue: model_uri},
      --test-data, {inputValue: test_data},
      --accuracy-threshold, {inputValue: accuracy_threshold},
      --output-report, {outputPath: report}
    ]
