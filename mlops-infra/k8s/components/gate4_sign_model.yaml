name: Sign Model
description: Подписание модели приватным ключом
inputs:
  - {name: model_path, type: String, description: 'Path to model file'}
  - {name: private_key, type: String, description: 'Path to private key PEM file'}
outputs:
  - {name: signature_file, type: String, description: 'Output signature JSON file'}
implementation:
  container:
    image: your-registry.example.com/mlops/gate4_signature_verify:latest
    command: [
      python, /app/sign_model.py,
      --private-key, {inputValue: private_key},
      --model-path, {inputValue: model_path},
      --output-signature, {outputPath: signature_file}
    ]
