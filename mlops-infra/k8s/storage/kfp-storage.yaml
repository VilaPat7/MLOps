---
# 1. Persistent Volume для KFP артефактов
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kfp-artifacts-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/kfp-artifacts
    type: DirectoryOrCreate
---
# 2. PVC для KFP артефактов
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kfp-artifacts-pvc
  namespace: kubeflow-pipelines
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# 3. ConfigMap для MinIO
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-config
  namespace: kubeflow-pipelines
data:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin123"
---
# 4. Deployment для MinIO
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: kubeflow-pipelines
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            configMapKeyRef:
              name: minio-config
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: minio-config
              key: MINIO_ROOT_PASSWORD
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        - name: storage
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: kfp-artifacts-pvc
---
# 5. Service для MinIO
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: kubeflow-pipelines
spec:
  ports:
  - port: 9000
    targetPort: 9000
    name: api
  - port: 9001
    targetPort: 9001
    name: console
  selector:
    app: minio
