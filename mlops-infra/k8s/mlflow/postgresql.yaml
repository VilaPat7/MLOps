# PersistentVolume - используем существующий storageClassName
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mlflow-postgres-pv
spec:
  storageClassName: standard  # ← изменено с manual на standard
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/mlflow-postgres"
---
# PersistentVolumeClaim - оставляем как есть
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-postgres-pvc
  namespace: mlflow-system
spec:
  storageClassName: standard  # ← изменено с manual на standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: "mlflow-postgres-pv"  # Добавьте эту строку
